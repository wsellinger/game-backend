name: Deploy Service (reusable)

on:
  workflow_call:
    inputs:
      service-name:
        description: "Container App / image name, e.g. didakt-auth"
        required: true
        type: string
      project-dir:
        description: "Path to the service's project directory (contains the Dockerfile)"
        required: true
        type: string
      resource-group:
        required: false
        type: string
        default: "didakt-rg"
      acr-name:
        required: false
        type: string
        default: "didaktacr"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # required for OIDC federated login
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: azacr login --name ${{ inputs.acr-name }}

      - name: Build and push image
        run: |
          IMAGE_TAG="${{ inputs.acr-name }}.azurecr.io/${{ inputs.service-name }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" -f "${{ inputs.project-dir }}/Dockerfile" "${{ inputs.project-dir }}"
          docker push "$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Deploy new revision to Container Apps
        run: |
          az containerapp update \
            --name ${{ inputs.service-name }} \
            --resource-group ${{ inputs.resource-group }} \
            --image "$IMAGE_TAG" \
            --revision-suffix "gh${{ github.run_number }}"

      - name: Show live URL
        run: |
          FQDN=$(az containerapp show \
            --name ${{ inputs.service-name }} \
            --resource-group ${{ inputs.resource-group }} \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "Deployed to https://$FQDN"